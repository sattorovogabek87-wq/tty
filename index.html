<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBudget Captcha</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 15px; margin: 0; background: #f4f6f9; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #captcha-container img { max-width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .btn { margin-top: 15px; width: 100%; padding: 12px; background: #2481cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h4>Rasmdagi harflarni bosib belgilang</h4>
    <div id="captcha-container">
        <p>Captcha yuklanmoqda...</p>
    </div>
    <button class="btn" onclick="submitCaptcha()">Tasdiqlash</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone');
    let points = [];
    let captchaUuid = "";

    async function loadCaptcha() {
        try {
            // 1. Flask serverdan UUID olish
            let req = await fetch('/api/proxy/captcha-request', { method: 'POST' });
            let res = await req.json();

            if (!res.success) {
                alert("Captcha UUID olishda xatolik!");
                return;
            }
            captchaUuid = res.uuid;

            // 2. Flask serverdan Captcha HTML ni olish
            let htmlReq = await fetch(`/api/proxy/captcha-html/${captchaUuid}`);
            let htmlText = await htmlReq.text();
            
            document.getElementById("captcha-container").innerHTML = htmlText;

            // Rasm B bosilganda koordinatalarni saqlash
            let imgB = document.getElementById("imageB");
            if (imgB) {
                imgB.addEventListener("click", function(e) {
                    let rect = e.target.getBoundingClientRect();
                    let x = Math.round(e.clientX - rect.left);
                    let y = Math.round(e.clientY - rect.top);
                    points.push({ id: `${x}${y}`, x: x, y: y });
                    tg.HapticFeedback.impactOccurred("light");
                });
            }
        } catch(err) {
            alert("Ulanish xatosi: " + err.message);
        }
    }

    async function submitCaptcha() {
        if (points.length === 0) {
            alert("Iltimos, rasmdagi harflarni bosing!");
            return;
        }

        try {
            // 3. Koordinatalarni Flask proxy orqali yuborish
            let response = await fetch('/api/proxy/submit-captcha', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uuid: captchaUuid,
                    phone: phone,
                    points: points
                })
            });

            let result = await response.json();

            if (result.success) {
                tg.sendData(JSON.stringify({ status: "success" }));
            } else {
                alert(result.message || "Captcha noto'g'ri, qayta urining.");
                points = [];
                loadCaptcha();
            }
        } catch(e) {
            alert("Yuborishda xatolik yuz berdi.");
        }
    }

    loadCaptcha();
</script>
</body>
</html>
