<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <title>Смс код орқали овоз бериш</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Roboto, Arial, sans-serif;
            font-size: 16px;
        }

        form {
            padding: .5rem 0;
        }

        label, input {
            display: block;
            width: 100%;
        }

        input[hidden='hidden'] {
            display: none;
        }

        label, .label {
            margin-bottom: .3rem;
        }

        label span {
            color: #d51d1d;
        }

        .label {
            color: #687477;
        }

        input {
            outline: none;
            font-size: 16px;
            line-height: 19px;
            border: none;
        }

        .form-item {
            margin-bottom: .3rem;
            padding: .5rem;
        }

        .d-flex {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            border: none;
            background-color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            padding: .5rem .7rem;
        }

        button[type='submit'] {
            background-color: #007791;
            color: white;
            padding: 14px 0;
            width: 100%;
        }

        button[type='submit']:disabled {
            background-color: rgba(0, 119, 145, 0.38);
            color: #909090;
            pointer-events: none;
        }

        button[type='button'] {
            max-width: 345px;
            margin: .5rem auto 0 auto;
            display: block;
            background-color: #f1f1f1;
            color: #007791;
        }

        button#refresh {
            margin: 0 .5rem;
            background-color: #f1f1f1;

        }

        .img-lazy {
            position: relative;
            width: 100%;
            max-width: 345px;
            margin: 0 auto;
            background-color: #f1f1f1;
            flex-direction: column;
        }

        .img-lazy img {
            width: 100%;
        }

        .img-lazy:not(.hide) {
            height: 200px;
        }

        .img-lazy::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%) rotate(0);
            border: 4px solid transparent;
            border-bottom-color: #026C81;
            border-left-color: #026C81;
            border-radius: 50%;
            animation: rotate infinite 1s linear;
        }

        .img-lazy.hide::before {
            display: none;
        }

        #imgLazy {
            position: relative;
        }

        #imgLazy div {
            position: absolute;
            background-color: rgba(0, 119, 145, 0.2);
            width: 40px;
            height: 40px;
            border: 2px solid #007791;
            border-radius: 50%;
        }

        @keyframes rotate {
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        h1 {
            text-align: center;
            font-size: 24px;
            padding: 1rem 2rem;
        }

        .error-alert {
            border: 1px solid #c53434;
            padding: 14px;
            border-radius: 4px;
            background-color: #e8cbcb;
            color: #c53434;
            margin: 1rem;
        }

        .hide-element {
            display: none;
        }

        .form-item-group {
            display: flex;
            border: 2px solid #f5f5f5;
            padding: 10px;
            align-items: center;
        }

        .form-item-group div {
            color: #687477;
            padding-right: .5rem;
        }

        form {
            max-width: 345px;
            margin: 0 auto;
        }

        .refresh-block {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .refresh-block label {
            margin-bottom: 0;
        }

        .refresh-block button {
            width: auto;
            margin: 0;
        }

        .progress {
            width: 100%;
            background-color: #f1f1f1;
            height: 6px;
            position: relative;
        }

        .progress-bar {
            transition: all .1s;
            width: 0;
            height: 100%;
            background-color: #007791;
            margin-top: .2rem;
        }

        .progress-bar-timer {
            width: 30px;
            height: 30px;
            position: absolute;
            right: 0;
            top: 50%;
            color: #ffffff;
            background-color: rgba(0, 0, 0, .5);
            backdrop-filter: blur(3px);
            border-radius: 50%;
            font-size: 14px;
            line-height: 30px;
            text-align: center;
            transform: translateY(-50%);
        }

        .progress-bar-timer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            border-left-color: #ffffff;
            border-bottom-color: #ffffff;
            animation: animation-before 1s linear infinite;
        }

        @keyframes animation-before {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
